name: Publish image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      promote_latest:
        description: Also update the latest image tag
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/mac-guardian
          flavor: latest=false
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.promote_latest }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publication receipt
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="ghcr.io/${OWNER,,}/mac-guardian@${DIGEST}"
          {
            echo "Published immutable image: \`${ref}\`"
            echo
            echo "Make the GHCR package public and verify anonymous pull before listing it."
            echo "Plow admission and WIP removal remain admin decisions."
            echo
            echo '```sh'
            echo "plow-agents image promote mac-guardian ${ref}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
